name: Build DittoPortable

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/README.md'
      - '**/ReadMe.md'

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build-portable:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download zlib packages
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        shell: pwsh
        run: |
          $version = '1.2.11.8900'
          $packagesDir = Join-Path $PWD 'packages'
          $packageIds = @('zlib-msvc-x64', 'zlib-msvc-x86')

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Path $packagesDir -Force | Out-Null

          foreach ($packageId in $packageIds) {
            $packageUrl = "https://www.nuget.org/api/v2/package/$packageId/$version"
            $packageFile = Join-Path $env:RUNNER_TEMP "$packageId.$version.nupkg"
            $extractDir = Join-Path $packagesDir "$packageId.$version"

            Remove-Item $packageFile -Force -ErrorAction SilentlyContinue
            Remove-Item $extractDir -Recurse -Force -ErrorAction SilentlyContinue

            Invoke-WebRequest -Uri $packageUrl -OutFile $packageFile
            [System.IO.Compression.ZipFile]::ExtractToDirectory($packageFile, $extractDir)
          }

      - name: Verify restored zlib package
        shell: pwsh
        run: |
          $zlibLib = 'packages\zlib-msvc-x64.1.2.11.8900\build\native\lib_release\zlibstatic.lib'
          if (!(Test-Path $zlibLib)) {
            Write-Host 'Top-level packages directory contents:'
            Get-ChildItem 'packages' -Force -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Missing restored zlib package file: $zlibLib"
          }

      - name: Build 64bit
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=Release /p:Platform=x64

      - name: Resolve latest release version
        shell: pwsh
        run: |
          $version = git tag --sort=-version:refname |
            Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "No numeric release tag found."
          }

          $portableBaseName = "DittoPortable_64bit_{0}" -f ($version -replace '\.', '_')
          "DITTO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PORTABLE_BASENAME=$portableBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stamp Ditto version
        shell: pwsh
        run: |
          .\DittoSetup\rcedit-x64.exe .\Release64\Ditto.exe --set-file-version $env:DITTO_VERSION --set-product-version $env:DITTO_VERSION

      - name: Build portable zip
        shell: cmd
        run: DittoSetup\BuildPortableZIP.bat "%PORTABLE_BASENAME%" bit64

      - name: Extract portable package
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'portable-artifact'
          Remove-Item $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path ".\DittoSetup\output\$env:PORTABLE_BASENAME.zip" -DestinationPath $artifactDir -Force

          if (-not (Test-Path (Join-Path $artifactDir 'Ditto\Ditto.exe'))) {
            throw "Portable package does not contain Ditto\\Ditto.exe"
          }

      - name: Upload DittoPortable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DittoPortable-x64-${{ env.DITTO_VERSION }}
          if-no-files-found: error
          path: portable-artifact\Ditto\*
