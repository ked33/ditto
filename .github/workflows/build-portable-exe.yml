name: Build DittoPortable EXE

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/README.md'
      - '**/ReadMe.md'

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build-portable-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build 64bit
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=Release /p:Platform=x64

      - name: Resolve latest release version
        shell: pwsh
        run: |
          $version = git tag --sort=-version:refname |
            Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "No numeric release tag found."
          }

          $artifactBaseName = "DittoPortable_64bit_{0}" -f ($version -replace '\.', '_')
          "DITTO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARTIFACT_BASENAME=$artifactBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stamp Ditto version
        shell: pwsh
        run: |
          .\DittoSetup\rcedit-x64.exe .\Release64\Ditto.exe --set-file-version $env:DITTO_VERSION --set-product-version $env:DITTO_VERSION

      - name: Build portable exe
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: DittoSetup\DittoPortable_10.iss
          options: /F"${{ env.ARTIFACT_BASENAME }}"

      - name: Upload DittoPortable exe
        uses: actions/upload-artifact@v4
        with:
          name: DittoPortable-exe-x64-${{ env.DITTO_VERSION }}
          if-no-files-found: error
          path: DittoSetup\output\${{ env.ARTIFACT_BASENAME }}.exe
