name: Build DittoPortable

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/README.md'
      - '**/ReadMe.md'

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln
  CI_PLATFORM_TOOLSET: v143

jobs:
  build-portable:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Verify themed popup menus
        shell: pwsh
        run: .\.github\scripts\Test-ThemedPopupMenu.ps1

      - name: Restore native NuGet packages
        shell: pwsh
        run: .\.github\scripts\Restore-NativePackages.ps1

      - name: Build 64bit
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ env.CI_PLATFORM_TOOLSET }}

      - name: Verify full-text search with compiled ICU tokenizer
        shell: pwsh
        run: |
          $env:DITTO_ICU_EXTENSION = (Resolve-Path .\Release64\ICU_Loader.dll).Path
          python tests/search_static_checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/search_sql_regression.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/search_filter_regression.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve latest release version
        shell: pwsh
        run: |
          $version = git tag --sort=-version:refname |
            Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' } |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "No numeric release tag found."
          }

          $portableBaseName = "DittoPortable_64bit_{0}" -f ($version -replace '\.', '_')
          "DITTO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PORTABLE_BASENAME=$portableBaseName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stamp Ditto version
        shell: pwsh
        run: |
          .\DittoSetup\rcedit-x64.exe .\Release64\Ditto.exe --set-file-version $env:DITTO_VERSION --set-product-version $env:DITTO_VERSION

      - name: Build portable zip
        shell: cmd
        run: DittoSetup\BuildPortableZIP.bat "%PORTABLE_BASENAME%" bit64

      - name: Extract portable package
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'portable-artifact'
          Remove-Item $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path ".\DittoSetup\output\$env:PORTABLE_BASENAME.zip" -DestinationPath $artifactDir -Force

          if (-not (Test-Path (Join-Path $artifactDir 'Ditto\Ditto.exe'))) {
            throw "Portable package does not contain Ditto\\Ditto.exe"
          }

          python tests/theme_package_checks.py --package-dir (Join-Path $artifactDir 'Ditto')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload DittoPortable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DittoPortable-x64-${{ env.DITTO_VERSION }}
          if-no-files-found: error
          path: portable-artifact\Ditto\*
