name: MSBuild

on:
  pull_request:
    paths-ignore:
      - '**/README.md'

env:
  SOLUTION_FILE_PATH: CP_Main_10.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install zlib packages
        working-directory: ${{env.GITHUB_WORKSPACE}}
        shell: pwsh
        run: |
          nuget install zlib-msvc-x64 -Version 1.2.11.8900 -OutputDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive -DirectDownload -NoCache -Verbosity detailed
          nuget install zlib-msvc-x86 -Version 1.2.11.8900 -OutputDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive -DirectDownload -NoCache -Verbosity detailed

      - name: Verify restored zlib package
        shell: pwsh
        run: |
          $zlibLib = 'packages\zlib-msvc-x64.1.2.11.8900\build\native\lib_release\zlibstatic.lib'
          if (!(Test-Path $zlibLib)) {
            Write-Host 'Top-level packages directory contents:'
            Get-ChildItem 'packages' -Force -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Missing restored zlib package file: $zlibLib"
          }

      - name: Build 64bit
        run: msbuild CP_Main_10.sln /p:Configuration=Release /p:Platform=x64
